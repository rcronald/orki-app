name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  verificar:
    name: Lint, formato, typecheck, pruebas y build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Obtener el código
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Configurar Node desde .nvmrc
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Verificar formato
        run: npm run format:check

      - name: Typecheck
        run: npm run typecheck

      - name: Pruebas
        run: npm test

      # Pruebas de los scripts de mantenimiento en Node (node:test), con Clerk y Supabase
      # simulados: no hacen ninguna petición de red.
      - name: Pruebas de los scripts
        run: npm run test:scripts

      - name: Build
        run: npm run build

      # Presupuesto de tamaño (#149): vuelve a construir la app como producción, con
      # valores ficticios que no apuntan a ningún servicio (scripts/medicion/entorno.mjs),
      # y falla si el JavaScript inicial, el CSS o el total precacheado por el service
      # worker superan apps/web/presupuesto-tamano.json. Ver docs/medicion-de-carga.md.
      - name: Presupuesto de tamaño
        run: |
          npm run build:medicion
          npm run presupuesto

  # Pruebas de extremo a extremo (#148): los flujos principales en Chromium,
  # Firefox, WebKit y un perfil de iPhone, contra la app construida como
  # producción con Clerk simulado y Supabase simulado en la red de Playwright.
  # No usa secretos ni sale a ningún servicio (las pruebas fallan si la app lo
  # intenta). Por ahora no es obligatorio para fusionar; ver el README.
  #
  # Un job por perfil, en paralelo: cada uno instala solo su navegador y corre
  # solo sus pruebas, así el CI no espera a los cuatro en fila y un fallo dice
  # en qué navegador ocurrió. El perfil «celular» usa WebKit.
  extremo-a-extremo:
    name: Pruebas de extremo a extremo (${{ matrix.perfil }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      # Que un navegador falle no cancela los demás: interesa verlos todos.
      fail-fast: false
      matrix:
        include:
          - perfil: chromium
            navegador: chromium
          - perfil: firefox
            navegador: firefox
          - perfil: webkit
            navegador: webkit
          - perfil: celular
            navegador: webkit
    steps:
      - name: Obtener el código
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Configurar Node desde .nvmrc
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      # El navegador depende de la versión exacta de @playwright/test: la caché
      # se invalida sola al actualizarla. Una caché por navegador.
      - name: Versión de Playwright
        id: playwright
        run: echo "version=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"
        working-directory: apps/web

      - name: Caché del navegador
        id: cache-navegadores
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}-${{ matrix.navegador }}

      - name: Instalar el navegador y sus dependencias del sistema
        if: steps.cache-navegadores.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps ${{ matrix.navegador }}
        working-directory: apps/web

      # Con el navegador en caché solo faltan las bibliotecas del sistema.
      - name: Instalar las dependencias del sistema del navegador
        if: steps.cache-navegadores.outputs.cache-hit == 'true'
        run: npx playwright install-deps ${{ matrix.navegador }}
        working-directory: apps/web

      - name: Build de las pruebas
        run: npm run build:e2e

      - name: Pruebas de extremo a extremo
        run: npm run test:e2e:sin-build -- --project=${{ matrix.perfil }}

      - name: Guardar el informe y las trazas
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: informe-playwright-${{ matrix.perfil }}
          path: |
            apps/web/playwright-report/
            apps/web/test-results/
          retention-days: 14

  importacion-catalogo:
    name: Importación del catálogo (Python)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: scripts/catalog-import
    # Postgres desechable para las pruebas de integración de la carga, igual que el del job
    # de base de datos: las pruebas crean en él una base plantilla con lo mínimo de Supabase y
    # todas las migraciones, y una copia por prueba. La contraseña no es un secreto: el
    # contenedor solo vive mientras dura el job.
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: supabase_admin
          POSTGRES_PASSWORD: desechable
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U supabase_admin -d postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      ORKI_TEST_DB_URL: postgresql://supabase_admin:desechable@127.0.0.1:5432/postgres
    steps:
      - name: Obtener el código
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      # uv toma su versión de required-version en pyproject.toml e instala el Python de
      # .python-version. La caché depende de uv.lock.
      - name: Instalar uv
        uses: astral-sh/setup-uv@v10.3.3
        with:
          working-directory: scripts/catalog-import
          cache-dependency-glob: uv.lock

      - name: Instalar Python y dependencias
        run: uv sync --locked

      - name: Lint
        run: uv run --locked ruff check

      - name: Verificar formato
        run: uv run --locked ruff format --check

      # El CSV versionado de la lista curada de híbridos tiene que pasar la validación de
      # formato (aunque tenga filas sin revisar). No se conecta a ninguna base.
      - name: Validar la lista curada de híbridos
        run: uv run --locked orki-catalogo validar-hibridos data/hibridos.csv

      # Las pruebas usan la muestra versionada y bloquean cualquier conexión de red; las de
      # la carga se conectan además al Postgres local del servicio (sin él fallarían, porque
      # en el CI no se pueden saltar).
      - name: Pruebas
        run: uv run --locked pytest

  base-de-datos:
    name: Pruebas de base de datos
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Postgres desechable con la misma versión mayor que los proyectos de Supabase. Se usa la
    # imagen oficial y el mínimo de Supabase lo simula scripts/db-desechable, igual que en
    # local. El superusuario se llama supabase_admin para que "postgres" sea, como en
    # Supabase, un rol sin superusuario. La contraseña no es un secreto: el contenedor solo
    # vive mientras dura el job.
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: supabase_admin
          POSTGRES_PASSWORD: desechable
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U supabase_admin -d postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      ORKI_TEST_DB_URL: postgresql://supabase_admin:desechable@127.0.0.1:5432/postgres
    steps:
      - name: Obtener el código
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Configurar Node desde .nvmrc
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      # Las pruebas solo necesitan Node y psql; la comprobación de tipos usa además la CLI de
      # Supabase y Prettier del proyecto.
      - name: Instalar dependencias
        run: npm ci

      - name: Comprobar el cliente psql
        run: |
          if ! command -v psql > /dev/null; then
            sudo apt-get update
            sudo apt-get install -y --no-install-recommends postgresql-client
          fi
          psql --version

      - name: Pruebas de base de datos
        run: npm run db:test

      # Genera los tipos desde las migraciones sobre el mismo Postgres y falla si no coinciden
      # con apps/web/src/lib/database.types.ts. Corre aunque fallen las pruebas, para ver
      # ambos resultados en la misma ejecución.
      - name: Comprobar los tipos generados del esquema
        if: ${{ !cancelled() }}
        run: npm run db:types:check
