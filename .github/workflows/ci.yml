name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  verificar:
    name: Lint, formato, typecheck, pruebas y build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Obtener el código
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Configurar Node desde .nvmrc
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Verificar formato
        run: npm run format:check

      - name: Typecheck
        run: npm run typecheck

      - name: Pruebas
        run: npm test

      - name: Build
        run: npm run build

  importacion-catalogo:
    name: Importación del catálogo (Python)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: scripts/catalog-import
    steps:
      - name: Obtener el código
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      # uv toma su versión de required-version en pyproject.toml e instala el Python de
      # .python-version. La caché depende de uv.lock.
      - name: Instalar uv
        uses: astral-sh/setup-uv@v10.3.3
        with:
          working-directory: scripts/catalog-import
          cache-dependency-glob: uv.lock

      - name: Instalar Python y dependencias
        run: uv sync --locked

      - name: Lint
        run: uv run --locked ruff check

      - name: Verificar formato
        run: uv run --locked ruff format --check

      # Las pruebas usan la muestra versionada y bloquean cualquier conexión de red.
      - name: Pruebas
        run: uv run --locked pytest

  base-de-datos:
    name: Pruebas de base de datos
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Postgres desechable con la misma versión mayor que los proyectos de Supabase. Se usa la
    # imagen oficial y el mínimo de Supabase lo simula scripts/db-desechable, igual que en
    # local. El superusuario se llama supabase_admin para que "postgres" sea, como en
    # Supabase, un rol sin superusuario. La contraseña no es un secreto: el contenedor solo
    # vive mientras dura el job.
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: supabase_admin
          POSTGRES_PASSWORD: desechable
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U supabase_admin -d postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      ORKI_TEST_DB_URL: postgresql://supabase_admin:desechable@127.0.0.1:5432/postgres
    steps:
      - name: Obtener el código
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Configurar Node desde .nvmrc
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      # Las pruebas solo necesitan Node y psql; la comprobación de tipos usa además la CLI de
      # Supabase y Prettier del proyecto.
      - name: Instalar dependencias
        run: npm ci

      - name: Comprobar el cliente psql
        run: |
          if ! command -v psql > /dev/null; then
            sudo apt-get update
            sudo apt-get install -y --no-install-recommends postgresql-client
          fi
          psql --version

      - name: Pruebas de base de datos
        run: npm run db:test

      # Genera los tipos desde las migraciones sobre el mismo Postgres y falla si no coinciden
      # con apps/web/src/lib/database.types.ts. Corre aunque fallen las pruebas, para ver
      # ambos resultados en la misma ejecución.
      - name: Comprobar los tipos generados del esquema
        if: ${{ !cancelled() }}
        run: npm run db:types:check
